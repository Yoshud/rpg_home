[project]
name = "rpghome"
version = "0.1.0"
description = "Local sound-scene player for tabletop RPG sessions at home"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
rpghome = "rpghome.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
