[project]
name = "rpghome"
version = "0.1.0"
description = "Local sound-scene player for tabletop RPG sessions at home"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.29.1",
]

[project.scripts]
rpghome = "rpghome.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two top-level packages: the app (rpghome) and the engine process (rpghome_engine).
module-name = ["rpghome", "rpghome_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
