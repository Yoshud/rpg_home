# RPG HOME broker. Reachable only from this machine (127.0.0.1 port mapping in
# docker-compose.yml) and from containers on the compose network (mosquitto:1883).
listener 1883
allow_anonymous true

# Keep retained messages across restarts (named volume mosquitto-data).
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
